<html>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7fa; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 8px; border: 1px solid #e1e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <header style="text-align: center;">
            <img src="https://cdn-icons-png.flaticon.com/128/16855/16855390.png" width="60" alt="Logo">
            <h1 style="color: #0f172a; font-size: 24px; margin-top: 10px;">SecureBank</h1>
        </header>
        
        <div style="color: #334155; line-height: 1.6; font-size: 16px; padding: 20px 0;">
            {% block content %}{% endblock %}
        </div>

        <footer style="text-align: center; border-top: 1px solid #f1f5f9; padding-top: 20px; margin-top: 20px;">
            <p style="font-size: 12px; color: #94a3b8;">
                © 2026 SecureBank. All rights reserved.<br>
                This is an automated system message, please do not reply.
            </p>
        </footer>
    </div>
</body>
</html>
